name: Vérifications P1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Dépendances des vérifications
        run: python -m pip install -r python/requirements.txt -r catalog/requirements.txt jsonschema==4.26.0
      - name: Tests unitaires du suivi direct
        run: python -B scripts/test_suivi_direct.py
      - name: Tests du laboratoire Qwen sans modèle
        run: python -B -m unittest discover -s scripts -p 'test_qwen*.py'
      - name: Contrat, régressions et intégration Compose
        env:
          PYTHONUNBUFFERED: '1'
        run: python -B scripts/verify_t09.py --all
